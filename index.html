
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voyageurs en Inde | Voyages Sur Mesure d'Exception</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Leaflet for proper maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fdfbf7;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .text-saffron { color: #db8b21; }
      .bg-saffron { background-color: #db8b21; }
      .bg-brown-btn { background-color: #B37012; }
      .border-saffron { border-color: #db8b21; }
      
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #fdfbf7;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2d5c5;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #db8b21;
      }
      
      .dropdown-animate {
        animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Fix for Leaflet in absolute containers */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background: #fdfbf7 !important;
      }
      .leaflet-vignette {
        box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
        pointer-events: none;
        z-index: 400;
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
